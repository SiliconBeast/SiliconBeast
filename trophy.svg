<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 112" width="120" height="112" shape-rendering="crispEdges">
  <style>
    .sp{fill:#C9F6FA;animation:tw 1.8s steps(1) infinite}
    .s2{animation-delay:.6s}.s3{animation-delay:1.2s}
    .cup{animation:bob 2.4s ease-in-out infinite}
    @keyframes tw{0%{opacity:1}33%{opacity:0}}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  </style>
  <g class="cup" fill="#39C5CF">
    <rect x="24" y="8" width="72" height="8"/>
    <rect x="8" y="16" width="16" height="8"/><rect x="24" y="16" width="72" height="8"/><rect x="96" y="16" width="16" height="8"/>
    <rect x="8" y="24" width="8" height="16"/><rect x="24" y="24" width="72" height="16"/><rect x="104" y="24" width="8" height="16"/>
    <rect x="16" y="40" width="8" height="8"/><rect x="24" y="40" width="72" height="8"/><rect x="96" y="40" width="8" height="8"/>
    <rect x="32" y="48" width="56" height="8"/>
    <rect x="40" y="56" width="40" height="8"/>
    <rect x="48" y="64" width="24" height="8"/>
    <rect x="56" y="72" width="8" height="16"/>
    <rect x="40" y="88" width="40" height="8"/>
    <rect x="32" y="96" width="56" height="8"/>
    <rect x="32" y="16" width="8" height="32" fill="#C9F6FA"/>
    <rect x="80" y="16" width="8" height="40" fill="#1F6F75"/>
    <rect x="52" y="24" width="16" height="16" fill="#0D1117"/>
    <rect x="56" y="28" width="8" height="8" fill="#39C5CF"/>
  </g>
  <rect class="sp" x="4" y="2" width="4" height="4"/>
  <rect class="sp s2" x="110" y="58" width="4" height="4"/>
  <rect class="sp s3" x="14" y="76" width="4" height="4"/>
</svg>
