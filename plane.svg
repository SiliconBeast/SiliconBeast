<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 100" width="220" height="100" shape-rendering="crispEdges">
  <style>
    .cl{fill:#30363D;animation:drift 7s linear infinite}
    .c2{animation-duration:10s;animation-delay:-4s;opacity:.6}
    .pl{animation:bob 2s ease-in-out infinite}
    .prop{animation:spin .15s steps(1) infinite}
    @keyframes drift{from{transform:translateX(0)}to{transform:translateX(-300px)}}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
    @keyframes spin{0%{opacity:1}50%{opacity:.2}}
  </style>
  <g class="cl"><rect x="230" y="16" width="32" height="8"/><rect x="238" y="8" width="16" height="8"/><rect x="222" y="24" width="48" height="6"/></g>
  <g class="cl c2"><rect x="240" y="70" width="40" height="8"/><rect x="250" y="62" width="20" height="8"/></g>
  <g class="pl">
    <rect x="64" y="34" width="10" height="16" fill="#39C5CF"/>
    <rect x="58" y="48" width="18" height="4" fill="#39C5CF"/>
    <rect x="70" y="48" width="74" height="10" fill="#39C5CF"/>
    <rect x="118" y="42" width="16" height="6" fill="#C9F6FA"/>
    <rect x="92" y="40" width="28" height="6" fill="#1F6F75"/>
    <rect x="92" y="58" width="28" height="6" fill="#1F6F75"/>
    <rect x="144" y="50" width="8" height="6" fill="#8B949E"/>
    <rect class="prop" x="152" y="42" width="3" height="22" fill="#C9D1D9"/>
    <rect x="40" y="52" width="14" height="2" fill="#8B949E" opacity=".5"/>
    <rect x="28" y="52" width="8" height="2" fill="#8B949E" opacity=".3"/>
  </g>
</svg>
