<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" shape-rendering="crispEdges">
  <style>
    .pin{fill:#8B949E}
    .die{fill:#39C5CF;animation:glow 2.4s ease-in-out infinite}
    .bit{fill:#0D1117;animation:blink 1.2s steps(1) infinite}
    .b2{animation-delay:.3s}.b3{animation-delay:.6s}.b4{animation-delay:.9s}
    .sig{fill:#39C5CF;animation:run 1.6s linear infinite}
    @keyframes glow{0%,100%{opacity:.45}50%{opacity:1}}
    @keyframes blink{0%{opacity:1}50%{opacity:0}}
    @keyframes run{0%{opacity:0}20%{opacity:1}100%{opacity:0}}
  </style>
  <!-- pins -->
  <g class="pin">
    <rect x="44" y="14" width="8" height="18"/><rect x="60" y="14" width="8" height="18"/><rect x="76" y="14" width="8" height="18"/><rect x="92" y="14" width="8" height="18"/><rect x="108" y="14" width="8" height="18"/>
    <rect x="44" y="128" width="8" height="18"/><rect x="60" y="128" width="8" height="18"/><rect x="76" y="128" width="8" height="18"/><rect x="92" y="128" width="8" height="18"/><rect x="108" y="128" width="8" height="18"/>
    <rect x="14" y="44" width="18" height="8"/><rect x="14" y="60" width="18" height="8"/><rect x="14" y="76" width="18" height="8"/><rect x="14" y="92" width="18" height="8"/><rect x="14" y="108" width="18" height="8"/>
    <rect x="128" y="44" width="18" height="8"/><rect x="128" y="60" width="18" height="8"/><rect x="128" y="76" width="18" height="8"/><rect x="128" y="92" width="18" height="8"/><rect x="128" y="108" width="18" height="8"/>
  </g>
  <!-- signals on pins -->
  <rect class="sig" x="76" y="14" width="8" height="4"/>
  <rect class="sig" x="128" y="92" width="4" height="8" style="animation-delay:.5s"/>
  <rect class="sig" x="14" y="60" width="4" height="8" style="animation-delay:1s"/>
  <!-- package -->
  <rect x="32" y="32" width="96" height="96" fill="#161B22" stroke="#39C5CF" stroke-width="2"/>
  <rect x="38" y="38" width="6" height="6" fill="#39C5CF"/>
  <!-- die -->
  <rect class="die" x="56" y="56" width="48" height="48"/>
  <rect class="bit" x="62" y="62" width="8" height="8"/>
  <rect class="bit b2" x="76" y="62" width="8" height="8"/>
  <rect class="bit b3" x="90" y="76" width="8" height="8"/>
  <rect class="bit b4" x="62" y="90" width="8" height="8"/>
  <rect class="bit b2" x="76" y="90" width="8" height="8"/>
  <text x="80" y="122" fill="#8B949E" font-family="monospace" font-size="8" text-anchor="middle">SD-2027</text>
</svg>
