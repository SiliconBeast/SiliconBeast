<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 156" width="140" height="156" shape-rendering="crispEdges">
  <style>
    .ant{animation:a 1s steps(1) infinite}
    .eye{transform-box:fill-box;transform-origin:center;animation:blink 3.5s infinite}
    .arm{transform-box:fill-box;transform-origin:top center;animation:wave 1.2s ease-in-out infinite}
    .led{animation:a 1.2s steps(1) infinite}.d2{animation-delay:.4s}.d3{animation-delay:.8s}
    .bot{animation:hop 2.4s ease-in-out infinite}
    @keyframes a{50%{opacity:.15}}
    @keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
    @keyframes wave{0%,100%{transform:rotate(-150deg)}50%{transform:rotate(-110deg)}}
    @keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  </style>
  <g class="bot">
    <rect x="57" y="6" width="6" height="12" fill="#8B949E"/>
    <rect class="ant" x="52" y="0" width="16" height="8" fill="#F85149"/>
    <rect x="16" y="30" width="8" height="20" fill="#D2A8FF"/>
    <rect x="96" y="30" width="8" height="20" fill="#D2A8FF"/>
    <rect x="24" y="18" width="72" height="48" fill="#FFA657"/>
    <rect x="24" y="60" width="72" height="6" fill="#F0883E"/>
    <rect x="32" y="26" width="56" height="30" fill="#0D1117"/>
    <rect class="eye" x="42" y="32" width="10" height="12" fill="#7EE787"/>
    <rect class="eye" x="68" y="32" width="10" height="12" fill="#7EE787"/>
    <rect x="48" y="48" width="4" height="4" fill="#7EE787"/>
    <rect x="52" y="50" width="16" height="4" fill="#7EE787"/>
    <rect x="68" y="48" width="4" height="4" fill="#7EE787"/>
    <rect x="52" y="66" width="16" height="6" fill="#8B949E"/>
    <rect x="12" y="76" width="14" height="10" fill="#79C0FF"/>
    <rect x="12" y="86" width="10" height="20" fill="#79C0FF"/>
    <rect x="10" y="106" width="14" height="8" fill="#8B949E"/>
    <g class="arm"><rect x="92" y="76" width="10" height="28" fill="#79C0FF"/><rect x="90" y="102" width="14" height="8" fill="#8B949E"/></g>
    <rect x="28" y="72" width="64" height="44" fill="#58A6FF"/>
    <rect x="28" y="110" width="64" height="6" fill="#388BFD"/>
    <rect x="38" y="80" width="44" height="22" fill="#0D1117"/>
    <rect class="led" x="44" y="86" width="8" height="8" fill="#F85149"/>
    <rect class="led d2" x="56" y="86" width="8" height="8" fill="#FFE66D"/>
    <rect class="led d3" x="68" y="86" width="8" height="8" fill="#3FB950"/>
    <rect x="36" y="116" width="16" height="22" fill="#8B949E"/>
    <rect x="68" y="116" width="16" height="22" fill="#8B949E"/>
    <rect x="30" y="138" width="26" height="8" fill="#F0883E"/>
    <rect x="64" y="138" width="26" height="8" fill="#F0883E"/>
  </g>
  <text x="60" y="155" fill="#8B949E" font-family="monospace" font-size="8" text-anchor="middle">BIT · co-pilot</text>
</svg>
